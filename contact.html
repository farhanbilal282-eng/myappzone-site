<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — MyAppZone</title>
<meta name="description" content="Contact MyAppZone. Send a message and we will get back to you.">
<meta name="theme-color" content="#16A34A">

<link rel="canonical" href="https://www.myappzone.online/contact.html">
<meta property="og:title" content="Contact — MyAppZone"><meta property="og:description" content="Contact MyAppZone. Send a message and we will get back to you."><meta property="og:type" content="website"><meta property="og:site_name" content="MyAppZone">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/site.css">
</head>
<body>

<header id="site-header"></header>
<main id="main">

<section class="pagehead"><div class="wrap"><h1>Contact</h1><p>Have a question or an idea? Send us a message.</p></div></section>
<div class="wrap split">
 <form id="cf" class="formcard wide" style="margin:0;max-width:none" novalidate>
  <div id="msg" role="status" aria-live="polite"></div>
  <div class="field"><label for="n">Name</label><input id="n" name="name" autocomplete="name" maxlength="100" required><span class="bad" id="n-e"></span></div>
  <div class="field"><label for="e">Email</label><input id="e" name="email" type="email" autocomplete="email" maxlength="200" required><span class="bad" id="e-e"></span></div>
  <div class="field"><label for="m">Message</label><textarea id="m" name="message" maxlength="3000" required></textarea><span class="bad" id="m-e"></span></div>
  <div class="hp" aria-hidden="true"><label>Leave empty<input id="website" tabindex="-1" autocomplete="off"></label></div>
  <button class="btn" id="send" type="submit">Send Message</button>
 </form>
 <div class="info" id="info" hidden><h2 style="margin:0">Contact details</h2></div>
</div>
</main>
<footer id="site-footer"></footer>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script>Maz.Auth.ready().then(function(){Maz.chrome("contact");});</script>
<script src="js/contact.js"></script>
</body>
</html>
